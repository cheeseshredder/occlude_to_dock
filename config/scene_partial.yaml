# Scene Configuration: Partial Occlusion
# =======================================
# Robot starts offset from plant axis - charger edges ARE visible initially
# Plant creates ~50% occlusion of charger from start position
#
# Geometry:
#   - Robot at (0.0, 0.7) - offset +Y from the plant-charger axis
#   - Plant at (2.0, 0.0) with radius 0.2m - partially blocks charger
#   - Charger at (2.8, 0.0) - ~50% visible (edges/side visible)
#
# Visibility calculation:
#   From (0, 0.7), line-of-sight to charger grazes plant edge
#   Robot can see approximately half of the charger's front face
#
# Expected behavior:
#   - Robot can detect charger from start (partial view)
#   - Still needs to navigate around plant for clear approach
#   - Should be easier than heavy occlusion
#
# Target metrics (from proposal):
#   - Success rate: ≥85%
#   - Time to dock: ≤60s

scene_name: "partial_occlusion"
room_size: [6.0, 6.0]

# Object Positions (in world frame, meters)
objects:
  charger:
    type: "box"
    size: [0.3, 0.2, 0.4]  # width (X), depth (Y), height (Z)
    position: [2.8, 0.0, 0.5]  # Against east wall
    orientation: [0, 0, 180]  # degrees [roll, pitch, yaw] - facing room
    color: [0.0, 0.8, 0.0]  # GREEN
    semantic_label: "charger"
    
  plant:
    type: "cylinder"
    radius: 0.2
    height: 1.0
    position: [2.0, 0.0, 0.5]  # 0.8m in front of charger
    orientation: [0, 0, 0]
    color: [0.8, 0.0, 0.0]  # RED
    semantic_label: "plant"
    
  distractor_1:
    type: "box"
    size: [0.35, 0.25, 0.45]
    position: [2.0, 1.5, 0.5]
    orientation: [0, 0, 45]
    color: [0.7, 0.7, 0.7]  # Gray
    semantic_label: "distractor"
    
  distractor_2:
    type: "box"
    size: [0.35, 0.25, 0.45]
    position: [2.0, -1.5, 0.5]
    orientation: [0, 0, -30]
    color: [0.7, 0.7, 0.7]  # Gray
    semantic_label: "distractor"

# Robot Start Configuration
robot_start:
  position: [0.0, 0.7, 0.0]  # Offset +Y for ~50% charger visibility - PARTIAL OCCLUSION
  orientation: [0, 0, 0]  # Facing positive X (towards charger)

# Domain Randomization
domain_randomization:
  enabled: true
  lighting:
    intensity_range: [0.5, 1.5]
    color_temp_range: [3000, 6500]  # Kelvin
  object_position_noise: 0.1  # meters
  
# Occlusion Configuration
occlusion_level: "partial"
expected_visibility: 0.5  # ~50% of charger visible from start position
