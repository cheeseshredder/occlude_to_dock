# Scene Configuration: Heavy Occlusion
# =====================================
# Robot starts directly behind plant - charger is NOT visible initially
# The robot must navigate around the plant to discover and dock with charger
#
# Geometry:
#   - Robot at (0.0, 0.0) - aligned with plant and charger on Y=0 axis
#   - Plant at (2.0, 0.0) with radius 0.2m - completely blocks charger
#   - Charger at (2.8, 0.0) - hidden behind plant from start position
#
# Expected behavior:
#   - Robot cannot see charger initially
#   - Must use exploration/belief to find charger
#   - Navigation around plant required
#
# Target metrics (from proposal):
#   - Success rate: ≥65%
#   - Time to dock: ≤90s
#
# Achieved (100 trials): 81% success, 28.6s avg time

scene_name: "heavy_occlusion"
room_size: [6.0, 6.0]

# Object Positions (in world frame, meters)
objects:
  charger:
    type: "box"
    size: [0.3, 0.2, 0.4]  # width (X), depth (Y), height (Z)
    position: [2.8, 0.0, 0.5]  # Against east wall
    orientation: [0, 0, 180]  # degrees [roll, pitch, yaw] - facing room
    color: [0.0, 0.8, 0.0]  # GREEN
    semantic_label: "charger"
    
  plant:
    type: "cylinder"
    radius: 0.2
    height: 1.0
    position: [2.0, 0.0, 0.5]  # 0.8m in front of charger, ON the robot-charger axis
    orientation: [0, 0, 0]
    color: [0.8, 0.0, 0.0]  # RED
    semantic_label: "plant"
    
  distractor_1:
    type: "box"
    size: [0.35, 0.25, 0.45]
    position: [2.0, 1.5, 0.5]
    orientation: [0, 0, 45]
    color: [0.7, 0.7, 0.7]  # Gray
    semantic_label: "distractor"
    
  distractor_2:
    type: "box"
    size: [0.35, 0.25, 0.45]
    position: [2.0, -1.5, 0.5]
    orientation: [0, 0, -30]
    color: [0.7, 0.7, 0.7]  # Gray
    semantic_label: "distractor"

# Robot Start Configuration
robot_start:
  position: [0.0, 0.0, 0.0]  # Directly behind plant - HEAVY OCCLUSION
  orientation: [0, 0, 0]  # Facing positive X (towards charger)

# Domain Randomization
domain_randomization:
  enabled: true
  lighting:
    intensity_range: [0.5, 1.5]
    color_temp_range: [3000, 6500]  # Kelvin
  object_position_noise: 0.1  # meters
  
# Occlusion Configuration
occlusion_level: "heavy"
expected_visibility: 0.0  # Charger NOT visible from start position
